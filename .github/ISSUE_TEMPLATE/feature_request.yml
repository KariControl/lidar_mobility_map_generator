name: Feature request
description: Propose a change without publishing sensitive map data
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case without attaching private point clouds, rosbag
        files, exact site coordinates, vehicle registrations, faces, or
        credentials.
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Explain the problem to solve using synthetic or redacted examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and its expected output.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private point cloud, site, vehicle, personal, and credential data from this request.
          required: true
